name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run root tests
        run: npm test

      - name: Install Homey Watchdog dependencies
        working-directory: Homey_Watchdog
        run: npm ci

      - name: Run Homey Watchdog tests
        working-directory: Homey_Watchdog
        run: npm test

      - name: Validate Homey app for publishing
        working-directory: Homey_Watchdog
        run: npm run validate:publish

      - name: Build Homey app
        working-directory: Homey_Watchdog
        run: npm run build
